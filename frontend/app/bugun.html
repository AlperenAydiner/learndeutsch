<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bugün — Ich spreche Deutsch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/pages/today.css">
</head>
<body>

<div data-nav></div>

<main class="wrap section" id="main">

    <div class="notice notice--error" id="hata" role="alert" hidden></div>

    <p class="loading" id="yukleniyor">Yükleniyor…</p>

    <!-- ---------- Program yok / gün yok ---------- -->
    <div class="empty" id="bos" hidden>
        <h2 id="bosBaslik">Bugün için bir şey yok</h2>
        <p id="bosAciklama"></p>
        <div class="empty__actions">
            <a class="btn btn--primary" href="/app/program.html">Programa git</a>
        </div>
    </div>

    <!-- ---------- Gün ---------- -->
    <div id="gun" hidden>
        <div class="today__head">
            <div>
                <div class="today__day" id="gunNo"></div>
                <div id="rozet"></div>
                <h1 class="today__title" id="baslik"></h1>
                <p class="today__grammar" id="gramer"></p>
            </div>
            <div class="today__side">
                <div class="today__stat">
                    <b id="seri">0</b>
                    <span>günlük seri</span>
                </div>
                <div class="today__stat">
                    <b id="kalan">—</b>
                    <span>gün kaldı</span>
                </div>
            </div>
        </div>

        <div class="progress">
            <div class="progress__bar">
                <div class="progress__done" id="cubukDone" style="width:0%"></div>
            </div>
            <div class="progress__text">
                <span id="ilerlemeSol"></span>
                <span id="ilerlemeSag"></span>
            </div>
        </div>

        <div id="gorevler"></div>

        <div class="finished" id="bitti" hidden>
            Bugünü tamamladın. Yarın görüşürüz.
        </div>
    </div>

</main>

<script type="module">
    import { requireAuth } from "/assets/js/core/guard.js";
    import { gunFarki } from "/assets/js/core/tarih.js";
    import { api, ApiError } from "/assets/js/core/api.js";

    const BLOK_ADI = {
        KELIME: "Kelime", GRAMER: "Gramer", HOEREN: "Hören", LESEN: "Lesen",
        SCHREIBEN: "Schreiben", SPRECHEN: "Sprechen", SINAV_PRATIGI: "Sınav pratiği",
    };

    /** Sitede yapilan gorevler: isaretleme degil, dogrudan basla. */
    const ICERIDE = {
        KELIME: { href: "/app/kelimeler.html", label: "Tekrara başla" },
        GRAMER: { href: "/app/quiz.html", label: "Quiz'i çöz" },
    };

    const DURUMLAR = [
        { value: "DONE",    label: "Yaptım",       sinif: "done" },
        { value: "PARTIAL", label: "Yarım yaptım", sinif: "partial" },
        { value: "MISSED",  label: "Yapamadım",    sinif: "missed" },
    ];

    /** Sunucudan gelen alan adlarinin Turkce karsiliklari. */
    const SORU = {
        anlama:       "Ne kadar anladın?",
        metin_sayisi: "Kaç kısa metin yazdın?",
        kalip:        "Kalıpları kullanabildin mi?",
        kayit:        "Kendini kaydettin mi?",
        nasil:        "Nasıl geçti?",
    };

    const SECENEK = {
        AZ: "az", YARISI: "yarısı", COGU: "çoğu",
        HIC: "hiç", KISMEN: "kısmen", RAHAT: "rahat",
        EVET: "evet", HAYIR: "hayır",
        COK_TAKILDIM: "çok takıldım", IDARE_EDER: "idare eder", AKICI: "akıcıydı",
    };

    const hata = document.getElementById("hata");

    const session = await requireAuth();
    if (session) {
        await yukle();
    }

    async function yukle() {
        try {
            goster(await api.get("/today"));
        } catch (err) {
            if (err instanceof ApiError && err.status === 404) {
                bosGoster(err.message);
            } else {
                hataGoster(err.message);
            }
        } finally {
            document.getElementById("yukleniyor").hidden = true;
        }
    }

    function bosGoster(mesaj) {
        document.getElementById("bosAciklama").textContent = mesaj;
        document.getElementById("bos").hidden = false;
    }

    function goster(gun) {
        document.getElementById("gun").hidden = false;

        document.getElementById("gunNo").textContent =
            `${gun.dayNumber}. gün / ${gun.totalDays}`;
        document.getElementById("baslik").textContent = gun.titleTr ?? "Tekrar günü";
        document.getElementById("gramer").textContent = gun.grammarSummary ?? "";
        document.getElementById("seri").textContent = gun.streak;

        const kalan = Math.max(0, gunFarki(gun.date, gun.endDate));
        document.getElementById("kalan").textContent = kalan;

        rozetGoster(gun.dayType);
        ilerlemeGoster(gun.progress);
        gorevleriGoster(gun.tasks);

        document.getElementById("bitti").hidden =
            gun.progress.done + gun.progress.partial + gun.progress.missed
                < gun.progress.total;
    }

    function rozetGoster(tip) {
        const kutu = document.getElementById("rozet");
        if (tip === "LIGHT") {
            kutu.innerHTML = '<span class="badge badge--light">hafif gün · yeni konu yok</span>';
        } else if (tip === "MOCK_EXAM") {
            kutu.innerHTML = '<span class="badge badge--mock">deneme sınavı</span>';
        } else {
            kutu.innerHTML = "";
        }
    }

    function ilerlemeGoster(p) {
        // Yarim yapilan gorev suresinin yarisi kadar sayilir; bu hesap
        // sunucuda yapiliyor, doneMinutes zaten o payi iceriyor.
        const yuzde = p.totalMinutes ? (p.doneMinutes / p.totalMinutes) * 100 : 0;
        document.getElementById("cubukDone").style.width = yuzde + "%";

        document.getElementById("ilerlemeSol").textContent =
            `${p.done} tamam · ${p.partial} yarım · ${p.missed} yapılmadı`;
        document.getElementById("ilerlemeSag").textContent =
            `${sure(p.doneMinutes)} / ${sure(p.totalMinutes)}`;
    }

    function gorevleriGoster(gorevler) {
        const kutu = document.getElementById("gorevler");
        kutu.innerHTML = gorevler.map(gorevHtml).join("");

        kutu.querySelectorAll("[data-mark]").forEach((btn) => {
            btn.addEventListener("click", () => isaretle(btn));
        });
        kutu.querySelectorAll("[data-field]").forEach((btn) => {
            btn.addEventListener("click", () => bildirimSec(btn));
        });
    }

    function gorevHtml(g) {
        const rapor = g.selfReport ? JSON.parse(g.selfReport) : {};
        const sinif = g.status ? ` task--${g.status.toLowerCase()}` : "";

        // Kelime ve gramer sitede olculuyor; kullaniciya "yaptim" dedirtmek
        // yerine dogrudan oraya goturuyoruz. Skor kendiliginden kaydediliyor.
        const iceride = ICERIDE[g.taskType];
        const baslaBtn = iceride && !g.status
            ? `<a class="btn btn--primary" href="${iceride.href}">${iceride.label}</a>`
            : "";

        const dugmeler = baslaBtn + DURUMLAR.map((d) => `
            <button class="mark mark--${d.sinif}" type="button"
                    data-mark="${g.id}" data-status="${d.value}"
                    aria-pressed="${g.status === d.value}">${d.label}</button>`).join("");

        // Sorular ancak gorev isaretlendikten sonra anlam kazanir.
        const sorular = g.reportFields.map((f) => `
            <div class="report__row">
                <span class="report__label">${SORU[f.name] ?? f.name}</span>
                <div class="report__options">
                    ${f.allowed.map((v) => `
                        <button class="pill" type="button"
                                data-field="${g.id}" data-name="${f.name}" data-value="${v}"
                                aria-pressed="${String(rapor[f.name] ?? "") === v}"
                        >${SECENEK[v] ?? v}</button>`).join("")}
                </div>
            </div>`).join("");

        return `
            <div class="task${sinif}" data-task="${g.id}">
                <div class="task__top">
                    <span class="task__name">${BLOK_ADI[g.taskType] ?? g.taskType}</span>
                    <span class="task__minutes">${sure(g.plannedMinutes)}</span>
                </div>
                ${g.instructionTr ? `<p class="task__instruction">${esc(g.instructionTr)}</p>` : ""}
                <div class="marks">${dugmeler}</div>
                ${sorular ? `<div class="report" ${raporSorulsun(g.status) ? "" : "hidden"}>${sorular}</div>` : ""}
            </div>`;
    }


    /**
     * Gorev yapilmadiysa "kac metin yazdin" diye sormak tutarsiz olur;
     * sorular yalnizca yapilan ve yarim yapilan gorevlerde gosterilir.
     */
    function raporSorulsun(status) {
        return status === "DONE" || status === "PARTIAL";
    }

    // ---------- işaretleme ----------

    async function isaretle(btn) {
        const taskId = btn.dataset.mark;
        const kutu = document.querySelector(`[data-task="${taskId}"]`);
        await gonder(taskId, btn.dataset.status, mevcutRapor(kutu), kutu);
    }

    async function bildirimSec(btn) {
        const taskId = btn.dataset.field;
        const kutu = document.querySelector(`[data-task="${taskId}"]`);

        const durum = kutu.querySelector('[aria-pressed="true"][data-status]');
        if (!durum) {
            hataGoster("Önce görevi işaretle, sonra soruyu cevapla.");
            return;
        }

        const rapor = mevcutRapor(kutu);
        // Ayni secenege tekrar basmak secimi kaldirir.
        rapor[btn.dataset.name] =
            btn.getAttribute("aria-pressed") === "true" ? "" : btn.dataset.value;

        await gonder(taskId, durum.dataset.status, rapor, kutu);
    }

    function mevcutRapor(kutu) {
        const rapor = {};
        kutu.querySelectorAll('[data-field][aria-pressed="true"]').forEach((b) => {
            rapor[b.dataset.name] = b.dataset.value;
        });
        return rapor;
    }

    async function gonder(taskId, status, selfReport, kutu) {
        hata.hidden = true;
        const dugmeler = kutu.querySelectorAll("button");
        dugmeler.forEach((b) => { b.disabled = true; });

        try {
            const temiz = Object.fromEntries(
                Object.entries(selfReport).filter(([, v]) => v !== ""));
            goster(await api.post(`/tasks/${taskId}/complete`,
                { status, selfReport: temiz }));
        } catch (err) {
            hataGoster(err.message);
            dugmeler.forEach((b) => { b.disabled = false; });
        }
    }

    // ---------- yardımcılar ----------

    function sure(dakika) {
        if (dakika < 60) return dakika + " dk";
        const saat = Math.floor(dakika / 60);
        const kalan = dakika % 60;
        return kalan === 0 ? `${saat} sa` : `${saat} sa ${kalan} dk`;
    }

    function hataGoster(mesaj) {
        hata.textContent = mesaj;
        hata.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function esc(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
    }
</script>

</body>
</html>
