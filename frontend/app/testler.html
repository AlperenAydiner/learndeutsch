<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Testler — Ich spreche Deutsch</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">
    <link rel="stylesheet" href="/assets/css/pages/onboarding.css">
    <link rel="stylesheet" href="/assets/css/pages/program.css">
</head>
<body>

<div data-nav></div>

<main class="wrap section">
    <h1>Testler</h1>

    <div class="notice notice--error" id="hata" role="alert" hidden></div>

    <div class="audience" style="margin-bottom: var(--sp-7);">
        <div class="audience__item card">
            <h3>Günün quiz'i</h3>
            <p>Bugünün konusuna ait 10 soru. Skorun otomatik kaydedilir ve
               programın buna göre ayarlanır.</p>
            <a class="btn btn--primary" style="margin-top: var(--sp-4);"
               href="/app/quiz.html">Quiz'i çöz</a>
        </div>
        <div class="audience__item card">
            <h3>Yerleştirme testi</h3>
            <p>39 soru. Bildiğin konuları programdan çıkarır. Tekrar çözersen
               programın yeni sonuca göre hesaplanabilir.</p>
            <a class="btn btn--ghost" style="margin-top: var(--sp-4);"
               href="/app/baslangic.html">Tekrar çöz</a>
        </div>
    </div>

    <h2 style="font-size: var(--fs-md);">Geçmiş sonuçların</h2>
    <div id="gecmis"><p style="color: var(--text-muted);">Yükleniyor…</p></div>
</main>

<style>
    .attempt { display: grid; grid-template-columns: 1fr 120px 70px;
               gap: var(--sp-3); align-items: center; padding: var(--sp-3) 0;
               border-bottom: 1px solid var(--border); font-size: var(--fs-sm); }
    .attempt__date { color: var(--text-faint); font-size: var(--fs-xs); }
    .attempt__bar { height: 8px; background: var(--surface-alt);
                    border-radius: 4px; overflow: hidden; }
    .attempt__fill { height: 100%; background: var(--accent); }
</style>

<script type="module">
    import { requireAuth } from "/assets/js/core/guard.js";
    import { api } from "/assets/js/core/api.js";

    const session = await requireAuth();
    if (session) {
        try {
            const p = await api.get("/progress");
            const kutu = document.getElementById("gecmis");

            kutu.innerHTML = p.scores.length
                ? [...p.scores].reverse().map((s) => `
                    <div class="attempt">
                        <div>
                            ${esc(s.titleTr)}
                            <div class="attempt__date">${tarih(s.date)}</div>
                        </div>
                        <div class="attempt__bar">
                            <div class="attempt__fill" style="width:${s.ratio * 100}%"></div>
                        </div>
                        <div style="text-align:right; font-family: var(--font-mono);">
                            %${Math.round(s.ratio * 100)}
                        </div>
                    </div>`).join("")
                : `<p style="color: var(--text-faint);">Henüz çözülmüş test yok.</p>`;
        } catch (err) {
            const h = document.getElementById("hata");
            h.textContent = err.message;
            h.hidden = false;
            document.getElementById("gecmis").innerHTML = "";
        }
    }

    function tarih(iso) {
        return new Date(iso).toLocaleDateString("tr-TR",
            { day: "numeric", month: "long", year: "numeric" });
    }

    function esc(s) {
        const d = document.createElement("div");
        d.textContent = s ?? "";
        return d.innerHTML;
    }
</script>

</body>
</html>
